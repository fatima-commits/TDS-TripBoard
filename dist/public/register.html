<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBoard · Create account</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">Trip<span>Board</span></a>
        <div>
          <p class="eyebrow">Travel management</p>
          <h1>Plan less.<br />Go further.</h1>
          <p>Create an account to build itineraries, manage bookings, and share trips with your team.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">Get started</p>
          <h2 id="auth-title">Create your account</h2>
          <p class="auth-copy">Your first itinerary takes about a minute.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
            <button class="auth-submit">Create account</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
