<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBoard · Sign in</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">Trip<span>Board</span></a>
        <div>
          <p class="eyebrow">Maneja tus viajes</p>
          <h1>Un viaje,<br />un itinerario.</h1>
          <p>Inicia sesión para planear rutas, rastrear compromisos, y mantener todo tu viaje en sincronia. A tu manera.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">Bienvenido de vuelta</p>
          <h2 id="auth-title">Inicia sesión en TripBoard</h2>
          <p class="auth-copy">Retoma desde donde tu ultimo viaje acabó.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
            <button class="auth-submit">Sign in</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">¿Nuevo en TripBoard? <a href="/register">Crea una cuenta</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
