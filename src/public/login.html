<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBoard · Sign in</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">Trip<span>Board</span></a>
        <div>
          <p class="eyebrow">Travel management</p>
          <h1>Every trip,<br />one itinerary.</h1>
          <p>Sign in to plan routes, track bookings, and keep your whole team's travel in sync.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">Welcome back</p>
          <h2 id="auth-title">Sign in to TripBoard</h2>
          <p class="auth-copy">Pick up where your next trip left off.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
            <button class="auth-submit">Sign in</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">New to TripBoard? <a href="/register">Create an account</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
