<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripBoard · Crear cuenta</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">Trip<span>Board</span></a>
        <div>
          <p class="eyebrow">Manejo de viajes</p>
          <h1>Planea menos.<br />Ve más lejos.</h1>
          <p>Crea una cuenta para construir itinerarios, manejar reservaciones, y compartir viajes con tu equipo.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">Empieza</p>
          <h2 id="auth-title">Crea tu cuenta</h2>
          <p class="auth-copy">Tu primer itinerario toma menos de un minuto.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
            <button class="auth-submit">Crear cuenta</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
